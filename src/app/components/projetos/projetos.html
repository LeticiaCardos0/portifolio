<section class="contents">
  @for (project of projects; track project.id; let isFirst = $first) {
    <article
      [attr.id]="isFirst ? 'projetos' : null"
      class="col-span-1 md:col-span-2 card-glass card-hover p-6 flex flex-col"
    >
      <div class="rounded-2xl overflow-hidden border border-glass-border mb-5 aspect-video bg-black/30">
        <img [src]="project.image" [alt]="project.title" class="w-full h-full object-cover" />
      </div>

      <h3 class="text-xl font-bold text-gradient mb-2">{{ project.title }}</h3>
      <p class="text-text-muted mb-4 flex-1">{{ project.description }}</p>

      <div class="flex flex-wrap gap-2 mb-5">
        @for (tag of project.tags; track tag) {
          <span class="text-xs font-medium px-3 py-1 rounded-full btn-outline text-text-main">
            {{ tag }}
          </span>
        }
      </div>

      <div class="flex flex-wrap gap-3">
        <a
          [href]="project.liveUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-gradient rounded-full px-5 py-2.5 flex items-center gap-2 font-medium text-white"
        >
          Ver Projeto
          <svg data-p-icon="external-link" class="w-4 h-4"></svg>
        </a>
        <a
          [href]="project.codeUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-outline rounded-full px-5 py-2.5 flex items-center gap-2 font-medium text-text-main"
        >
          Ver Código
          <svg data-p-icon="github" class="w-4 h-4"></svg>
        </a>
      </div>
    </article>
  }
</section>
