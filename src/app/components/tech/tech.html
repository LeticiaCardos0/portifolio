<section id="tecnologias" class="col-span-1 md:col-span-2 lg:col-span-4 card-glass card-hover p-8">
  <div class="flex items-center gap-3 mb-8">
    <app-icon name="code" class="w-5 h-5 text-primary" />
    <h2 class="text-xl font-semibold">Tecnologias</h2>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
    <div>
      <h3 class="text-sm font-semibold text-text-muted uppercase tracking-wide mb-4">Front-end</h3>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
        @for (tech of frontend; track tech.name) {
          <div
            class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl btn-outline text-center tech-tile"
          >
            <app-tech-icon [icon]="tech.icon" />
            <span class="text-xs text-text-muted">{{ tech.name }}</span>
          </div>
        }
      </div>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-accent uppercase tracking-wide mb-4">
        Back-end &amp; Ferramentas
      </h3>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
        @for (tech of backend; track tech.name) {
          <div
            class="relative flex flex-col items-center justify-center gap-2 p-4 rounded-xl btn-outline text-center tech-tile"
          >
            @if (tech.inProgress) {
              <span
                class="absolute top-2 right-2 w-3 h-3 rounded-full border-2 border-primary border-t-transparent animate-spin"
                aria-label="Em andamento"
              ></span>
            }
            <app-tech-icon [icon]="tech.icon" />
            <span class="text-xs text-text-muted">{{ tech.name }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
