<section id="sobre" class="contents">
  <!-- Sobre Mim -->
  <div class="col-span-1 card-glass card-hover p-8">
    <div class="flex items-center gap-3 mb-4">
      <app-icon name="person" class="w-5 h-5 text-primary" />
      <h2 class="text-lg font-semibold">{{ about.title }}</h2>
    </div>
    <p class="text-text-muted leading-relaxed">{{ about.text }}</p>
  </div>

  <!-- Status -->
  <div class="col-span-1 card-glass card-hover p-8 flex flex-col">
    <div class="flex items-center gap-3 mb-4">
      <app-icon name="chart" class="w-5 h-5 text-primary" />
      <h2 class="text-lg font-semibold">{{ status.title }}</h2>
    </div>
    <p class="text-text-muted mb-4">{{ status.label }}</p>

    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 h-2 rounded-full bg-white/10 overflow-hidden">
        <div
          class="h-full rounded-full btn-gradient progress-fill"
          [style.--progress-width.%]="status.progress"
        ></div>
      </div>
      <span class="text-sm font-semibold text-text-main">{{ status.progress }}%</span>
    </div>

    <span
      class="inline-flex items-center gap-2 self-start px-3 py-1.5 rounded-full text-success text-sm font-medium bg-success-bg"
    >
      <app-icon name="check" class="w-4 h-4" />
      {{ status.badge }}
    </span>
  </div>

  <!-- Localização -->
  <div class="col-span-1 card-glass card-hover p-8 flex flex-col">
    <div class="flex items-center gap-3 mb-4">
      <app-icon name="pin" class="w-5 h-5 text-primary" />
      <h2 class="text-lg font-semibold">{{ location.title }}</h2>
    </div>
    <div class="flex-1 flex items-center justify-center py-2 relative">
      <svg viewBox="0 0 90 60" class="w-28 h-20 text-primary/40">
        @for (i of mapDots; track i) {
          <circle [attr.cx]="dotX(i)" [attr.cy]="dotY(i)" r="1.4" fill="currentColor" />
        }
      </svg>
      <app-icon name="pin" class="w-5 h-5 text-accent absolute" />
    </div>
    <p class="text-center text-text-main font-medium">{{ location.text }}</p>
  </div>

  <!-- Experiência -->
  <div class="col-span-1 card-glass card-hover p-8">
    <div class="flex items-center gap-3 mb-4">
      <app-icon name="briefcase" class="w-5 h-5 text-primary" />
      <h2 class="text-lg font-semibold">{{ experience.title }}</h2>
    </div>
    <span
      class="inline-flex items-center gap-2 px-4 py-2 rounded-full btn-outline text-text-main font-medium mb-3"
    >
      <app-icon name="headset" class="w-4 h-4" />
      {{ experience.chip }}
    </span>
    <p class="text-text-muted text-sm">{{ experience.extra }}</p>
  </div>
</section>
