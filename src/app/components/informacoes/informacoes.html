<section class="contents">
  <!-- Sobre Mim -->
  <div id="sobre" class="col-span-1 card-glass card-hover p-8">
    <div class="flex items-center gap-3 mb-4">
      <i class="pi pi-user text-[20px] text-primary"></i>
      <h2 class="text-lg font-semibold">{{ about.title }}</h2>
    </div>
    <p class="text-text-muted leading-relaxed">{{ about.text }}</p>
  </div>

  <!-- Status -->
  <div class="col-span-1 card-glass card-hover p-8 flex flex-col">
    <div class="flex items-center gap-3 mb-4">
      <i class="pi pi-chart-line text-[20px] text-primary"></i>
      <h2 class="text-lg font-semibold">{{ status.title }}</h2>
    </div>
    <p class="text-text-muted mb-4">{{ status.label }}</p>

    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 h-2 rounded-full bg-glass-border overflow-hidden">
        <div class="h-full rounded-full btn-gradient progress-fill" [style.--progress-width.%]="status.progress"></div>
      </div>
      <span class="text-sm font-semibold text-text-main">{{ status.progress }}%</span>
    </div>

    <span
      class="inline-flex items-center gap-2 self-start px-3 py-1.5 rounded-full text-success text-sm font-medium bg-success-bg">
      <i class="pi pi-check-circle text-[16px]"></i>
      {{ status.badge }}
    </span>
  </div>

  <!-- Localização -->
  <div class="col-span-1 card-glass card-hover p-8">
    <div class="flex items-center gap-3 mb-4">
      <i class="pi pi-map-marker text-[20px] text-primary"></i>
      <h2 class="text-lg font-semibold">{{ location.title }}</h2>
    </div>
    <div class="flex justify-center py-2 relative">
      <img
        src="assets/mapa1.png"
        alt="Mapa do Brasil"
        class="w-36 h-28 object-contain"
      />
    </div>
    <p class="text-center text-text-main font-medium">{{ location.text }}</p>
  </div>

  <!-- Experiência -->
  <div class="col-span-1 card-glass card-hover p-8">
    <div class="flex items-center gap-3 mb-9">
      <i class="pi pi-briefcase text-[20px] text-primary"></i>
      <h2 class="text-lg font-semibold">{{ experience.title }}</h2>
    </div>
    <div class="flex flex-col items-start gap-3 mb-3">
      <span class="inline-flex items-center gap-2 px-11.5 py-2.5 rounded-full btn-gradient-outline text-text-main">
        <i class="pi pi-headphones text-[16px]"></i>
        {{ experience.chip }}
      </span>
      <span class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full btn-gradient-outline text-text-main">
        <i class="pi pi-headphones text-[16px]"></i>
        {{ experience.chip2 }}
      </span>
    </div>
  </div>
</section>
