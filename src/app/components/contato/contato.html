<section id="contato" class="col-span-1 md:col-span-2 lg:col-span-4 card-glass card-hover p-8">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="flex flex-col gap-4">
      <a
        [href]="contact.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-2xl p-5 flex items-center gap-4"
      >
        <span class="w-14 h-14 rounded-full btn-gradient flex items-center justify-center shrink-0">
          <i class="pi pi-linkedin text-[22px] text-white"></i>
        </span>
        <span class="flex flex-col">
          <span class="text-text-muted text-sm">Conecte-se no</span>
          <span class="text-text-main font-bold">LinkedIn</span>
        </span>
      </a>

      <a
        [href]="contact.github"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-2xl p-5 flex items-center gap-4"
      >
        <span class="w-14 h-14 rounded-full btn-gradient flex items-center justify-center shrink-0">
          <i class="pi pi-github text-[22px] text-white"></i>
        </span>
        <span class="flex flex-col">
          <span class="text-text-muted text-sm">Veja meus códigos</span>
          <span class="text-text-main font-bold">GitHub</span>
        </span>
      </a>

      <a
        [href]="'mailto:' + contact.email"
        class="rounded-2xl p-5 flex items-center gap-4"
      >
        <span class="w-14 h-14 rounded-full btn-gradient flex items-center justify-center shrink-0">
          <i class="pi pi-envelope text-[22px] text-white"></i>
        </span>
        <span class="flex flex-col">
          <span class="text-text-muted text-sm">Envie um e-mail</span>
          <span class="text-text-main font-bold">{{ contact.email }}</span>
        </span>
      </a>
    </div>

    <!-- Lado direito: formulário -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex items-center gap-3 mb-2">
        <i class="pi pi-send text-[20px] text-accent"></i>
        <h2 class="text-xl font-semibold">Vamos conversar?</h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input
          type="text"
          formControlName="name"
          placeholder="Seu Nome"
          class="input-surface border border-glass-border rounded-xl px-4 py-3 text-text-main placeholder:text-text-muted outline-none focus:border-primary transition-colors"
        />
        <input
          type="email"
          formControlName="email"
          placeholder="Seu E-mail"
          class="input-surface border border-glass-border rounded-xl px-4 py-3 text-text-main placeholder:text-text-muted outline-none focus:border-primary transition-colors"
        />
      </div>

      <textarea
        formControlName="message"
        placeholder="Sua Mensagem"
        rows="5"
        class="input-surface border border-glass-border rounded-xl px-4 py-3 text-text-main placeholder:text-text-muted outline-none focus:border-primary transition-colors resize-none"
      ></textarea>

      <button
        type="submit"
        class="cursor-pointer btn-gradient rounded-xl py-3.5 flex items-center justify-center font-semibold text-white w-full"
      >
        Enviar Mensagem
      </button>

      @if (submitted()) {
        <p class="text-success text-sm font-medium">
          Mensagem enviada com sucesso! Entrarei em contato em breve.
        </p>
      }
    </form>
  </div>
</section>
