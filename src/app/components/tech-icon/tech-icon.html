@if (icon === 'github') {
  <div class="w-9 h-9 rounded-lg flex items-center justify-center bg-neutral-800 text-white">
    <app-icon name="github" class="w-5 h-5" />
  </div>
} @else {
  <div [class]="badge.bg + ' ' + badge.text + ' w-9 h-9 rounded-lg flex items-center justify-center font-bold text-xs'">
    {{ badge.label }}
  </div>
}
